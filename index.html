<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Clash Arena</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#0b1020;font-family:'Arial',sans-serif;color:white}
#arena{position:relative;width:100%;height:100%;overflow:hidden}
.canvas-wrap{position:absolute;inset:0;background:linear-gradient(135deg,#16213e 0%,#0f3460 50%,#16213e 100%)}
#gameCanvas{width:100%;height:100%;display:block}
.wall{position:absolute;background:linear-gradient(135deg,#765440 0%,#5a3a2a 100%);border:3px solid #392b24;border-radius:9px;box-shadow:0 4px 8px rgba(0,0,0,0.5)}
/* HUD */
#hud{position:absolute;z-index:20;top:12px;left:12px;right:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;font-weight:bold}
.hud-item{background:rgba(0,0,0,0.6);padding:8px 12px;border-radius:12px;border:2px solid #333;display:flex;align-items:center;gap:8px}
.bar{flex:1;height:12px;background:#222;border:2px solid #111;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#40dd78,#2ecc71);width:100%;transition:width 0.1s}
#ammo{display:flex;gap:4px}
.ammo-dot{width:8px;height:8px;border-radius:50%;background:#ffb700;border:1px solid #fff}
.ammo-dot.empty{background:#333;border-color:#555}
#msg{position:absolute;z-index:20;top:60px;width:100%;text-align:center;font-weight:bold;font-size:18px;text-shadow:2px 2px 4px rgba(0,0,0,0.8)}
#joy{position:absolute;z-index:25;left:22px;bottom:24px;width:145px;height:145px;border:3px solid #ffffff22;background:rgba(255,255,255,0.04);border-radius:50%;box-shadow:inset 0 0 10px rgba(0,0,0,0.5)}
#stick{position:absolute;left:42px;top:42px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#ffffff22,#ffffff11);box-shadow:0 4px 8px rgba(0,0,0,0.5);transition:all 0.05s}
#atk,#super{position:absolute;z-index:25;border:4px solid #111;border-radius:50%;color:white;font-weight:bold;font-size:24px;cursor:pointer;transition:all 0.1s;user-select:none}
#atk{right:20px;bottom:25px;width:82px;height:82px;background:linear-gradient(135deg,#e94c5f,#c41c3b);box-shadow:0 4px 12px rgba(233,76,95,0.5)}
#super{right:112px;bottom:45px;width:68px;height:68px;background:linear-gradient(135deg,#efbd32,#ffc107);color:#211900;box-shadow:0 4px 12px rgba(239,189,50,0.5)}
#over{display:none;position:absolute;z-index:40;inset:0;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;text-align:center;backdrop-filter:blur(4px)}
.card{background:linear-gradient(135deg,#202a33,#1a2332);padding:28px;border-radius:20px;border:2px solid #ffc107;box-shadow:0 8px 32px rgba(0,0,0,0.8)}
.card button{padding:13px 25px;border:0;border-radius:12px;font-weight:bold;background:linear-gradient(135deg,#ffc107,#ffb700);color:#211900;cursor:pointer}
#scoreboard{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.55);padding:8px;border-radius:8px;border:2px solid #333;z-index:20}
/* Menu */
#menu{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(0,0,0,0.6),rgba(0,0,0,0.4))}
.menu-card{background:linear-gradient(135deg,#0f1724,#071029);padding:24px;border-radius:16px;border:2px solid #2a6cff;color:#fff;min-width:320px}
.modes{display:flex;gap:8px;margin:12px 0}
.char-list{display:flex;gap:8px;flex-wrap:wrap}
.char{padding:8px;border-radius:10px;background:#111;border:2px solid #222;cursor:pointer;min-width:120px}
.char.selected{border-color:#2a6cff;box-shadow:0 4px 12px rgba(42,108,255,0.2)}
.controls{font-size:12px;color:#aaa;margin-top:8px}
</style></head><body>
<div id="arena">
  <div class="canvas-wrap"><canvas id="gameCanvas"></canvas></div>
  <div class="wall" style="left:10%;top:23%;width:28%;height:10%"></div>
  <div class="wall" style="right:10%;top:23%;width:28%;height:10%"></div>
  <div class="wall" style="left:38%;top:44%;width:24%;height:10%"></div>
  <div class="wall" style="left:10%;bottom:22%;width:25%;height:10%"></div>
  <div class="wall" style="right:10%;bottom:22%;width:25%;height:10%"></div>

  <div id="hud">
    <div class="hud-item"><span>❤️</span><div class="bar"><div id="hp" class="fill"></div></div></div>
    <div class="hud-item"><span>🏆</span><span id="t">0</span></div>
    <div class="hud-item"><div class="resource"><span>🔋</span><div id="ammo"></div></div></div>
  </div>

  <div id="msg">⚡ ÉLIMINER L'ADVERSAIRE</div>
  <div id="stats"><div class="stat-line"><span>VOS HP:</span><span id="statHp">100</span></div><div class="stat-line"><span>ENNEMI:</span><span id="statEnem">100</span></div></div>

  <div id="joy"><div id="stick"></div></div>
  <button id="super">⚡</button>
  <button id="atk">🎯</button>

  <div id="over"><div class="card"><h1 id="res"></h1><p id="rw"></p><button onclick="location.reload()">REJOUER</button></div></div>

  <div id="menu">
    <div class="menu-card">
      <h2>Clash Arena</h2>
      <p>Choisis ton mode et ton combattant</p>
      <div class="modes"><label><input type="radio" name="mode" value="duel" checked> 1 vs 1</label><label><input type="radio" name="mode" value="br"> Battle Royale</label></div>
      <div class="char-list" id="charList"></div>
      <div class="controls">Contrôles: Joystick (ou WASD/Flèches), clic pour tirer, ⚡ pour spécial</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button id="startBtn">JOUER</button></div>
    </div>
  </div>

  <div id="scoreboard" style="display:none"></div>
</div>

<script>
// OffscreenCanvas renderer worker source as a blob string
const rendererWorkerSrc = `
let canvas,ctx,dpr=1,w=0,h=0;
self.onmessage = function(e){
  const msg = e.data;
  if(msg.type==='init'){
    canvas = msg.canvas;
    dpr = msg.dpr || 1;
    canvas.width = Math.round(msg.width * dpr);
    canvas.height = Math.round(msg.height * dpr);
    canvas.style = {};
    ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    w = msg.width; h = msg.height;
    return;
  }
  if(msg.type==='state' && ctx){
    const s = msg.state;
    // clear
    ctx.clearRect(0,0,w,h);
    // background
    const g = ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,'rgba(12,18,38,0.6)'); g.addColorStop(1,'rgba(4,8,20,0.6)'); ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    // walls
    ctx.save(); ctx.globalAlpha = 0.95; for(const wall of s.walls){ const lx = wall.left*w, ty = wall.top*h, rw = (wall.right-wall.left)*w, rh = (wall.bottom-wall.top)*h; ctx.fillStyle = '#2f1e17'; ctx.fillRect(lx,ty,rw,rh); ctx.strokeStyle='#392b24'; ctx.lineWidth=3; ctx.strokeRect(lx,ty,rw,rh); }
    // particles
    for(let i=s.particles.length-1;i>=0;i--){ const p=s.particles[i]; ctx.globalAlpha = Math.max(0,p.life); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x*w,p.y*h,2,0,Math.PI*2); ctx.fill(); }
    // bullets
    ctx.save(); for(const b of s.bullets){ const bx=b.x*w, by=b.y*h; ctx.beginPath(); ctx.fillStyle = (b.ownerId==='player')? '#ffe35b' : '#ff8190'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10; ctx.arc(bx,by,6,0,Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; } ctx.restore();
    // actors
    for(const a of s.actors){ const ax=a.x*w, ay=a.y*h; ctx.beginPath(); ctx.fillStyle = a.color; ctx.shadowColor = a.color; ctx.shadowBlur = 18; ctx.arc(ax,ay,28,0,Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; ctx.beginPath(); ctx.fillStyle = '#111'; ctx.arc(ax,ay,16,0,Math.PI*2); ctx.fill(); const hpw = 28*(a.hp/100); ctx.fillStyle='#2ecc71'; ctx.fillRect(ax-28,ay+22,hpw,6); ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.strokeRect(ax-28,ay+22,56,6); }
    // player
    if(s.player.hp>0){ const px=s.player.x*w, py=s.player.y*h; ctx.beginPath(); ctx.fillStyle=s.player.color; ctx.shadowColor=s.player.color; ctx.shadowBlur=22; ctx.arc(px,py,30,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; ctx.beginPath(); ctx.fillStyle='#0b0b0d'; ctx.arc(px,py,18,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.globalAlpha=0.6; ctx.arc(px,py,36,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; }
    ctx.restore();
  }
};
`;

const arena=document.getElementById('arena');
const canvas=document.getElementById('gameCanvas');
let rendererWorker = null;
let offscreenSupported = false;

function startRendererWorker(){
  if(typeof OffscreenCanvas === 'undefined' || typeof Worker === 'undefined') return false;
  try{
    const blob = new Blob([rendererWorkerSrc],{type:'application/javascript'});
    const url = URL.createObjectURL(blob);
    rendererWorker = new Worker(url);
    const a = arena.getBoundingClientRect();
    const off = canvas.transferControlToOffscreen();
    const dpr = devicePixelRatio || 1;
    rendererWorker.postMessage({type:'init',canvas:off,width:a.width,height:a.height,dpr:dpr},{transfer:[off]});
    offscreenSupported = true;
    return true;
  }catch(err){ console.warn('Offscreen canvas worker init failed:',err); offscreenSupported=false; return false; }
}

// If Offscreen is supported, initialize worker, otherwise fallback to main-thread rendering
startRendererWorker();

const ctxMain = (!offscreenSupported) ? canvas.getContext('2d') : null;

// rest of game code (physics, inputs) — main thread keeps the logic and sends state to renderer
const hpBar=document.getElementById('hp'), statHp=document.getElementById('statHp'), statEnem=document.getElementById('statEnem');
const atk=document.getElementById('atk'), sup=document.getElementById('super');
const msg=document.getElementById('msg'), ov=document.getElementById('over'), res=document.getElementById('res'), rw=document.getElementById('rw');
const ammoDisplay=document.getElementById('ammo');
const scoreboard=document.getElementById('scoreboard');

// Characters
const CHARACTERS=[
  {id:'ace',name:'Ace',color:'#3ca7ff',weapon:{name:'Pistol',damage:12,rate:0.28,projectileSpeed:0.6,spread:0}},
  {id:'brute',name:'Brute',color:'#ed5262',weapon:{name:'Shotgun',damage:8,rate:0.9,projectileSpeed:0.45,spread:0.6,pellets:6}},
  {id:'bolt',name:'Bolt',color:'#ffd166',weapon:{name:'SMG',damage:6,rate:0.08,projectileSpeed:0.75,spread:0.18}},
  {id:'hawk',name:'Hawk',color:'#9ad3bc',weapon:{name:'Sniper',damage:40,rate:1.6,projectileSpeed:1.5,spread:0}}
];

// Menu
const charList=document.getElementById('charList');
let selectedChar=CHARACTERS[0];
CHARACTERS.forEach(c=>{
  const d=document.createElement('div'); d.className='char'+(c===selectedChar? ' selected':''); d.id='char-'+c.id;
  d.innerHTML=`<div style="display:flex;align-items:center;gap:8px"><div style="width:30px;height:30px;border-radius:50%;background:${c.color};border:2px solid #000"></div><div><strong>${c.name}</strong><div style="font-size:12px;color:#aaa">${c.weapon.name}</div></div></div>`;
  d.onclick=()=>{document.querySelectorAll('.char').forEach(x=>x.classList.remove('selected'));d.classList.add('selected');selectedChar=c};
  charList.appendChild(d);
});

// Walls
function buildWalls(){
  const walls=[...document.querySelectorAll('.wall')];
  const a=arena.getBoundingClientRect();
  return walls.map(w=>{const r=w.getBoundingClientRect();return{left:(r.left-a.left)/a.width,top:(r.top-a.top)/a.height,right:(r.right-a.left)/a.width,bottom:(r.bottom-a.top)/a.height}});
}
let walls=buildWalls();
window.addEventListener('resize',()=>{walls=buildWalls(); resizeCanvas(); if(offscreenSupported){const a=arena.getBoundingClientRect(); rendererWorker.postMessage({type:'init',width:a.width,height:a.height,dpr:devicePixelRatio||1});}});

// Player/actors/bullets
let player={x:.22,y:.55,hp:100,maxHp:100,velX:0,velY:0,acc:0.04,ammo:3,maxAmmo:3,special:100,weapon:selectedChar.weapon,color:selectedChar.color};
let actors=[]; let bullets=[]; let particles=[];
let gameStarted=false, mode='duel';

function spawnActor(opts){ const a={x:opts.x||Math.random()*0.6+0.2,y:opts.y|| (Math.random()*0.6+0.2),hp:opts.hp||100,id:opts.id||('bot'+Math.floor(Math.random()*1000)),weapon:opts.weapon,color:opts.color||'#ed5262',ai:true}; actors.push(a); return a; }

function resetGame(){ actors=[]; bullets=[]; particles=[]; gameStarted=false; ov.style.display='none'; scoreboard.style.display='block'; player.x=.22; player.y=.55; player.hp=player.maxHp; player.velX=0; player.velY=0; player.ammo=player.maxAmmo; player.special=100; player.color=selectedChar.color; player.weapon=selectedChar.weapon; }

function startGame(){ const modeInput=document.querySelector('input[name="mode"]:checked'); mode=modeInput?modeInput.value:'duel'; resetGame(); document.getElementById('menu').style.display='none'; gameStarted=true; if(mode==='duel'){ spawnActor({x:.78,y:.45,hp:100,weapon:CHARACTERS[1].weapon,color:CHARACTERS[1].color,id:'Enemy1'}); } else { const positions=[[.78,.2],[.78,.8],[.5,.2]]; for(let i=0;i<3;i++){ const c=CHARACTERS[(i+1)%CHARACTERS.length]; spawnActor({x:positions[i][0],y:positions[i][1],hp:100,weapon:c.weapon,color:c.color,id:c.name+'#'+(i+1)}); } } }
document.getElementById('startBtn').onclick=startGame;

// Canvas sizing
function resizeCanvas(){ const r=arena.getBoundingClientRect(); canvas.width = r.width; canvas.height = r.height; canvas.style.width = r.width+'px'; canvas.style.height = r.height+'px'; }
resizeCanvas();

// Helpers
function toPixelsX(norm){ return norm*canvas.clientWidth; }
function toPixelsY(norm){ return norm*canvas.clientHeight; }
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// Movement input
let dxInput=0,dyInput=0; let keys={};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true}); window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
const j=document.getElementById('joy'),st=document.getElementById('stick');
j.onpointerdown=q=>{j.setPointerCapture(q.pointerId); active=true; mv(q)}; j.onpointermove=q=>{ if(active) mv(q)}; j.onpointerup=()=>{ active=false; dxInput=0; dyInput=0; st.style.left='42px'; st.style.top='42px'}; let active=false;
function mv(q){ const r=j.getBoundingClientRect(),a=Math.atan2(q.clientY-r.top-r.height/2,q.clientX-r.left-r.width/2),m=Math.min(48,Math.hypot(q.clientX-r.left-r.width/2,q.clientY-r.top-r.height/2)); dxInput=Math.cos(a)*(m/48); dyInput=Math.sin(a)*(m/48); st.style.left=(42+dxInput*48)+'px'; st.style.top=(42+dyInput*48)+'px'; }

// Shooting
let mouseX=0,mouseY=0; window.addEventListener('pointermove',e=>{ const a=arena.getBoundingClientRect(); mouseX=(e.clientX-a.left)/a.width; mouseY=(e.clientY-a.top)/a.height; });
function shoot(shooter,targetX,targetY){ if(shooter===player && player.ammo<=0) return; const w=shooter.weapon; if(!w) return; const angle=Math.atan2(targetY-shooter.y,targetX-shooter.x); const shots=(w.pellets||1); for(let i=0;i<shots;i++){ const spread=(w.spread||0)*(Math.random()*2-1); const a=angle+spread; const speed=w.projectileSpeed; bullets.push({x:shooter.x,y:shooter.y,dx:Math.cos(a)*speed,dy:Math.sin(a)*speed,ownerId:(shooter===player?'player':shooter.id||'bot'),damage:w.damage,life:1.5}); } if(shooter===player){ player.ammo--; updateAmmoUI(); }}

atk.onpointerdown=()=>{ if(gameStarted) shoot(player, mouseX, mouseY); };

// Particles for impacts
function spawnParticles(x,y,color,count=8){ for(let i=0;i<count;i++){ const a=Math.random()*Math.PI*2; const s=(Math.random()*0.8+0.2); particles.push({x,y,dx:Math.cos(a)*s,dy:Math.sin(a)*s,life:Math.random()*0.6+0.4,color}); } }

// AI
function aiStep(actor,dt){ if(actor.hp<=0) return; let target=player; let dist=Math.hypot(player.x-actor.x,player.y-actor.y); for(const a of actors) if(a!==actor && a.hp>0){ const d=Math.hypot(a.x-actor.x,a.y-actor.y); if(d<dist){dist=d;target=a;} } const ax=target.x-actor.x, ay=target.y-actor.y; const dlen=Math.hypot(ax,ay)||1; let speed=(actor.weapon.name==='SMG'?0.0022:0.0016); let vx=(ax/dlen)*speed, vy=(ay/dlen)*speed; let nx=actor.x+vx*dt*60, ny=actor.y+vy*dt*60; if(!willCollide(nx,ny,0.035)){ actor.x=nx; actor.y=ny; } else { if(!willCollide(actor.x+vx*dt*60,actor.y,0.035)) actor.x+=vx*dt*60; else if(!willCollide(actor.x,actor.y+vy*dt*60,0.035)) actor.y+=vy*dt*60; else { actor.x+= (Math.random()-0.5)*0.002; actor.y+= (Math.random()-0.5)*0.002; } } if(Math.random()<0.009 && Math.hypot(target.x-actor.x,target.y-actor.y)<0.6){ shoot(actor,target.x,target.y); } }

// Collision helpers
function circleRectCollide(cx,cy,r,rect){ const nearestX=Math.max(rect.left,Math.min(cx,rect.right)); const nearestY=Math.max(rect.top,Math.min(cy,rect.bottom)); const dx=cx-nearestX, dy=cy-nearestY; return (dx*dx+dy*dy) < r*r; }
function willCollide(x,y,r){ for(const w of walls) if(circleRectCollide(x,y,r,w)) return true; return false; }

// Update bullets
function updateBullets(dt){ for(let i=bullets.length-1;i>=0;i--){ const b=bullets[i]; b.x+=b.dx*dt*0.016; b.y+=b.dy*dt*0.016; b.life-=dt*0.016; if(willCollide(b.x,b.y,0.02) || b.x<0||b.x>1||b.y<0||b.y>1){ bullets.splice(i,1); continue; } if(b.ownerId!=='player'){ if(Math.hypot(player.x-b.x,player.y-b.y)<0.06){ player.hp-=b.damage; spawnParticles(player.x,player.y,'#ff6b6b',10); bullets.splice(i,1); if(player.hp<=0) end(false,'Tu as été éliminé'); continue; } } if(b.ownerId==='player'){ for(let j=actors.length-1;j>=0;j--){ const a=actors[j]; if(Math.hypot(a.x-b.x,a.y-b.y)<0.06){ a.hp-=b.damage; spawnParticles(a.x,a.y,'#ffd166',10); bullets.splice(i,1); if(a.hp<=0){ actors.splice(j,1); if(mode==='duel') end(true,'Adversaire éliminé'); else if(actors.length===0) end(true,'Tu es le dernier survivant!'); } break; } } } if(b.life<=0) bullets.splice(i,1); } }

// Fallback renderer when OffscreenCanvas not available
function fallbackRender(state){ const ctx = ctxMain; if(!ctx) return; const w = canvas.clientWidth, h = canvas.clientHeight; ctx.clearRect(0,0,w,h); const g = ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,'rgba(12,18,38,0.6)'); g.addColorStop(1,'rgba(4,8,20,0.6)'); ctx.fillStyle=g; ctx.fillRect(0,0,w,h); ctx.save(); ctx.globalAlpha=0.95; for(const wall of state.walls){ const lx=wall.left*w, ty=wall.top*h, rw=(wall.right-wall.left)*w, rh=(wall.bottom-wall.top)*h; ctx.fillStyle='#2f1e17'; ctx.fillRect(lx,ty,rw,rh); ctx.strokeStyle='#392b24'; ctx.lineWidth=3; ctx.strokeRect(lx,ty,rw,rh); } for(let i=state.particles.length-1;i>=0;i--){ const p=state.particles[i]; ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x*w,p.y*h,2,0,Math.PI*2); ctx.fill(); } ctx.save(); for(const b of state.bullets){ const bx=b.x*w, by=b.y*h; ctx.beginPath(); ctx.fillStyle=(b.ownerId==='player')?'#ffe35b':'#ff8190'; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=10; ctx.arc(bx,by,6,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; } ctx.restore(); for(const a of state.actors){ const ax=a.x*w, ay=a.y*h; ctx.beginPath(); ctx.fillStyle=a.color; ctx.shadowColor=a.color; ctx.shadowBlur=18; ctx.arc(ax,ay,28,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; ctx.beginPath(); ctx.fillStyle='#111'; ctx.arc(ax,ay,16,0,Math.PI*2); ctx.fill(); const hpw=28*(a.hp/100); ctx.fillStyle='#2ecc71'; ctx.fillRect(ax-28,ay+22,hpw,6); ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.strokeRect(ax-28,ay+22,56,6); } if(state.player.hp>0){ const px=state.player.x*w, py=state.player.y*h; ctx.beginPath(); ctx.fillStyle=state.player.color; ctx.shadowColor=state.player.color; ctx.shadowBlur=22; ctx.arc(px,py,30,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; ctx.beginPath(); ctx.fillStyle='#0b0b0d'; ctx.arc(px,py,18,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.globalAlpha=0.6; ctx.arc(px,py,36,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; } ctx.restore(); }

function sendStateToRenderer(){ const state = { walls: walls, actors: actors.map(a=>({x:a.x,y:a.y,hp:a.hp,color:a.color,id:a.id})), bullets: bullets.map(b=>({x:b.x,y:b.y,ownerId:b.ownerId,damage:b.damage})), particles: particles.map(p=>({x:p.x,y:p.y,life:p.life,color:p.color})), player: {x:player.x,y:player.y,hp:player.hp,color:player.color} };
  if(offscreenSupported && rendererWorker){ rendererWorker.postMessage({type:'state',state:state}); }
  else { fallbackRender(state); }
}

function setPosUI(){ hpBar.style.width=(player.hp/player.maxHp)*100+'%'; statHp.textContent=Math.max(0,Math.floor(player.hp)); statEnem.textContent=actors.map(a=>a.hp).join(' / '); scoreboard.innerHTML='<strong>Scoreboard</strong><br>'+(player.hp>0?`<div style="color:${player.color}">YOU: ${Math.floor(player.hp)}</div>`:'')+actors.map(a=>`<div style="color:${a.color}">${a.id}: ${Math.max(0,Math.floor(a.hp))}</div>`).join(''); sup.classList.toggle('unavailable',player.special<100); }

function updateAmmoUI(){ ammoDisplay.innerHTML=''; for(let i=0;i<player.maxAmmo;i++){ const dot=document.createElement('div'); dot.className='ammo-dot'+(i<player.ammo?'':' empty'); ammoDisplay.appendChild(dot);} }

function spawnCollectible(x,y){ particles.push({x,y,dx:0,dy:0,life:1.5,color:'#ffd166'}); }

function end(win,reason){ gameStarted=false; ov.style.display='flex'; res.textContent=win?'🏆 VICTOIRE':'💀 DÉFAITE'; rw.textContent=reason||''; }

// Main loop
let lastTime=performance.now(); let ammoTimer=0;
function loop(now){ const dt=(now-lastTime)/16.67; lastTime=now; if(gameStarted){ // inputs
  let kx=0,ky=0; if(keys['w']||keys['arrowup']) ky=-1; if(keys['s']||keys['arrowdown']) ky=1; if(keys['a']||keys['arrowleft']) kx=-1; if(keys['d']||keys['arrowright']) kx=1; let inputX=dxInput + kx, inputY=dyInput + ky; let len=Math.hypot(inputX,inputY)||1; inputX/=len; inputY/=len; if(len<0.001){ inputX=0; inputY=0; }
  // smooth accel
  player.velX = (player.velX||0) + (inputX*player.acc - (player.velX||0)) * Math.min(1,0.2*dt);
  player.velY = (player.velY||0) + (inputY*player.acc - (player.velY||0)) * Math.min(1,0.2*dt);
  let nx=player.x + player.velX*dt, ny=player.y + player.velY*dt; if(!willCollide(nx,ny,0.035)){ player.x=clamp(nx,0.04,0.96); player.y=clamp(ny,0.06,0.94); } else { if(!willCollide(nx,player.y,0.035)) player.x=nx; else player.velX=0; if(!willCollide(player.x,ny,0.035)) player.y=ny; else player.velY=0; }
  // AI
  for(const a of actors) aiStep(a,dt);
  // bullets
  updateBullets(dt);
  // particles update
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.dx*0.016; p.y+=p.dy*0.016; p.life-=0.016; if(p.life<=0) particles.splice(i,1); }
  // ammo regen
  ammoTimer+=dt*0.016; if(ammoTimer>0.5){ ammoTimer=0; if(player.ammo<player.maxAmmo && Math.random()<0.02){ player.ammo++; updateAmmoUI(); spawnCollectible(Math.random()*0.8+0.1,Math.random()*0.7+0.15); } }
  player.special=Math.min(100,player.special+0.2*dt);
  setPosUI(); sendStateToRenderer(); }
  requestAnimationFrame(loop);
}
resizeCanvas(); updateAmmoUI(); requestAnimationFrame(loop);

// Input: click to shoot
canvas.addEventListener('pointerdown',e=>{ if(!gameStarted) return; const a=arena.getBoundingClientRect(); const tx=(e.clientX-a.left)/a.width, ty=(e.clientY-a.top)/a.height; shoot(player,tx,ty); });

// Make sure walls are rebuilt after start
setTimeout(()=>{walls=buildWalls(); resizeCanvas(); if(offscreenSupported){ const a=arena.getBoundingClientRect(); rendererWorker.postMessage({type:'init',width:a.width,height:a.height,dpr:devicePixelRatio||1}); } },100);

</script>
